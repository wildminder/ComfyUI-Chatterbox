[project]
name = "ComfyUI-ChatterboxTTS"
description = "Super fast TTS and voice clonning tool"
version = "2.0.6"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "s3tokenizer",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: Intel XPU",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Audio watermarking. The vendored entry points import this defensively, so the
# node works without it and produces un-watermarked audio.
watermarking = ["resemble-perth"]
# Tokenizers for the multilingual node (CJK and Korean segmentation).
multilingual = ["pykakasi", "spacy-pkuseg"]
# Loudness normalisation for the Turbo node.
turbo = ["pyloudnorm"]

[project.urls]
Repository = "https://github.com/wildminder/ComfyUI-Chatterbox"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "wildai"
DisplayName = "WM Chatterbox TTS Revised"
Icon = ""
requires-comfyui = ">=0.37.0"